      - name: Install Android NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" "ndk;25.1.8937393" "cmake;3.22.1"

      - name: Build debug APK
        working-directory: upstream/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Verify and package skeleton
        run: |
          APK=upstream/android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          python3 - <<'PY'
          import zipfile
          apk='upstream/android/app/build/outputs/apk/debug/app-debug.apk'
          with zipfile.ZipFile(apk) as z:
              i=z.getinfo('assets/ge.z64')
              assert i.file_size == 12*1024*1024, i.file_size
              assert i.compress_type == zipfile.ZIP_STORED, i.compress_type
              names=set(z.namelist())
              assert 'lib/arm64-v8a/libgevr.so' in names
              assert 'lib/arm64-v8a/libSDL2.so' in names
              print('v7 skeleton OK', i.file_size)
          PY
          mkdir -p /tmp/geflat-output
          cp "$APK" /tmp/geflat-output/GoldenEye007-Android-ARM64-skeleton-v7.apk
          cp "$ANDROID_HOME/build-tools/34.0.0/lib/apksigner.jar" /tmp/geflat-output/apksigner.jar
          test -f "$HOME/.android/debug.keystore"
          cp "$HOME/.android/debug.keystore" /tmp/geflat-output/goldeneye-v7.keystore
          sha256sum "$APK"

      - name: Upload signing skeleton
        uses: actions/upload-artifact@v4
        with:
          name: GoldenEye007-Android-ARM64-skeleton-v7
          path: /tmp/geflat-output/
          if-no-files-found: error
          retention-days: 1
