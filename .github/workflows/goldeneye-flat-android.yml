name: GoldenEye Flat Android

on:
  push:
    branches: [chatgpt-goldeneye-apk]
    paths:
      - '.github/workflows/goldeneye-flat-android.yml'
      - 'geflat/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout build harness
        uses: actions/checkout@v4
        with:
          ref: chatgpt-goldeneye-apk

      - name: Reassemble flat-port kit
        run: |
          cat geflat/kit.part* | base64 -d > /tmp/geflat-kit.zip
          mkdir -p /tmp/geflat-kit
          unzip -q /tmp/geflat-kit.zip -d /tmp/geflat-kit
          test -f /tmp/geflat-kit/GoldenEyeAndroidFlatPort_CI/tools/apply_flat_port.py

      - name: Checkout GoldenEye VR v0.5.6
        run: |
          git clone --depth 1 --branch v0.5.6 https://github.com/MrSco/goldeneye-vr.git upstream

      - name: Apply smartphone flat port
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('upstream/port/fast3d/gfx_sdl2.cpp')
          s = p.read_text()
          old = '#ifndef ANDROID\n    SDL_GL_MakeCurrent(wnd, ctx);'
          new = '#ifndef ANDROID // if PC\n\n    SDL_GL_MakeCurrent(wnd, ctx);'
          if old not in s:
              raise SystemExit('SDL compatibility anchor not found')
          p.write_text(s.replace(old, new, 1))
          PY
          python3 /tmp/geflat-kit/GoldenEyeAndroidFlatPort_CI/tools/apply_flat_port.py "$GITHUB_WORKSPACE/upstream"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('upstream/android/app/src/main/java/com/gevr/port/MainActivity.java')
          s = p.read_text()
          anchor = '    public native void nativeInit(String dataPath);'
          compat = '''    // Compatibility with the retained Quest updater; flat Android only re-hides system UI.\n    public static final int REQUEST_INSTALL_PERMISSION = 0x6f;\n    public static final int REQUEST_INSTALLER = 0x70;\n\n    public void comeBackToVr() {\n        runOnUiThread(this::hideSystemUi);\n    }\n\n    public void cancelComeBackToVr() {\n        // No delayed VR transition exists in the flat smartphone activity.\n    }\n\n'''
          if anchor not in s:
              raise SystemExit('MainActivity native anchor not found')
          p.write_text(s.replace(anchor, compat + anchor, 1))

          # Reserve an uncompressed 12 MiB asset slot. The real ROM is never uploaded;
          # its bytes are substituted locally after the APK is downloaded.
          g = Path('upstream/android/app/build.gradle')
          gs = g.read_text()
          android_anchor = 'android {\n'
          if android_anchor not in gs:
              raise SystemExit('build.gradle android block not found')
          gs = gs.replace(android_anchor, android_anchor + "    aaptOptions { noCompress 'z64' }\n", 1)
          g.write_text(gs)
          asset = Path('upstream/android/app/src/main/assets/ge.z64')
          asset.parent.mkdir(parents=True, exist_ok=True)
          with asset.open('wb') as f:
              f.truncate(12 * 1024 * 1024)
          PY

      - name: Install Android NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;25.1.8937393" \
            "cmake;3.22.1"

      - name: Build debug APK
        working-directory: upstream/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Verify reserved ROM slot
        run: |
          APK=upstream/android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          python3 - <<'PY'
          import zipfile
          apk='upstream/android/app/build/outputs/apk/debug/app-debug.apk'
          with zipfile.ZipFile(apk) as z:
              i=z.getinfo('assets/ge.z64')
              assert i.file_size == 12*1024*1024, i.file_size
              assert i.compress_type == zipfile.ZIP_STORED, i.compress_type
              print('ROM slot OK:', i.file_size, 'bytes, STORED')
          PY
          ls -lh "$APK"
          sha256sum "$APK"
          mkdir -p /tmp/geflat-output
          cp "$APK" /tmp/geflat-output/GoldenEye007-Android-ARM64-skeleton.apk
          cp "$ANDROID_HOME/build-tools/34.0.0/lib/apksigner.jar" /tmp/geflat-output/apksigner.jar

      - name: Upload signing skeleton
        uses: actions/upload-artifact@v4
        with:
          name: GoldenEye007-Android-ARM64-skeleton
          path: /tmp/geflat-output/
          if-no-files-found: error
          retention-days: 1
