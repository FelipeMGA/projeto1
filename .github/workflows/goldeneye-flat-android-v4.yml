name: GoldenEye Flat Android v4

on:
  push:
    branches: [chatgpt-goldeneye-apk]
    paths:
      - '.github/workflows/goldeneye-flat-android-v4.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout build harness
        uses: actions/checkout@v4
        with:
          ref: chatgpt-goldeneye-apk

      - name: Reassemble flat-port kit
        run: |
          cat geflat/kit.part* | base64 -d > /tmp/geflat-kit.zip
          mkdir -p /tmp/geflat-kit
          unzip -q /tmp/geflat-kit.zip -d /tmp/geflat-kit
          test -f /tmp/geflat-kit/GoldenEyeAndroidFlatPort_CI/tools/apply_flat_port.py

      - name: Checkout GoldenEye VR v0.5.6
        run: |
          git clone --depth 1 --branch v0.5.6 https://github.com/MrSco/goldeneye-vr.git upstream

      - name: Apply smartphone flat port v4
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Compatibility anchor expected by the existing flat-port patch.
          p = Path('upstream/port/fast3d/gfx_sdl2.cpp')
          s = p.read_text()
          old = '#ifndef ANDROID\n    SDL_GL_MakeCurrent(wnd, ctx);'
          new = '#ifndef ANDROID // if PC\n\n    SDL_GL_MakeCurrent(wnd, ctx);'
          if old not in s:
              raise SystemExit('SDL compatibility anchor not found')
          p.write_text(s.replace(old, new, 1))
          PY

          python3 /tmp/geflat-kit/GoldenEyeAndroidFlatPort_CI/tools/apply_flat_port.py "$GITHUB_WORKSPACE/upstream"

          python3 - <<'PY'
          from pathlib import Path

          # Java compatibility with retained updater classes.
          p = Path('upstream/android/app/src/main/java/com/gevr/port/MainActivity.java')
          s = p.read_text()
          anchor = '    public native void nativeInit(String dataPath);'
          compat = '''    // Flat-phone compatibility with retained Quest updater hooks.\n    public static final int REQUEST_INSTALL_PERMISSION = 0x6f;\n    public static final int REQUEST_INSTALLER = 0x70;\n\n    public void comeBackToVr() {\n        runOnUiThread(this::hideSystemUi);\n    }\n\n    public void cancelComeBackToVr() {\n    }\n\n'''
          if anchor not in s:
              raise SystemExit('MainActivity native anchor not found')
          p.write_text(s.replace(anchor, compat + anchor, 1))

          # Flat Android must never enter the OVR multiview shader path.
          ogl = Path('upstream/port/fast3d/gfx_opengl.cpp')
          os = ogl.read_text()
          old = '''    // VR\n    gfx_opengl_init_multiview();'''
          new = '''    // VR\n#ifdef GE_ANDROID_FLAT\n    use_multiview = false;\n#else\n    gfx_opengl_init_multiview();\n#endif'''
          if old not in os:
              raise SystemExit('multiview init anchor not found')
          os = os.replace(old, new, 1)

          # v4 root fix: in the VR fork gl_Position is assigned only inside vr_shader,
          # and vr_shader is emitted only when use_multiview=true. Once multiview is
          # disabled for a phone, vertex positions were therefore undefined and every
          # frame could remain black. Restore the ordinary Fast3D 2D/desktop path.
          old = '''    // VR\n    if (use_multiview) {\n        append_line(vs_buf, &vs_len, vr_shader);\n        // GoldenEye decal band (gfx_opengl_draw_triangles): a view-space nudge\n        append_line(vs_buf, &vs_len, "gl_Position.z += uDecalBias.x / max(gl_Position.w, max(uDecalBias.y, 0.0001));");\n    }'''
          new = '''    // VR / flat Android\n#ifdef GE_ANDROID_FLAT\n    // Normal single-view Fast3D vertex output. The VR fork otherwise assigns\n    // gl_Position only from vr_shader when multiview is enabled.\n    append_line(vs_buf, &vs_len, "    gl_Position = aVtxPos;");\n#else\n    if (use_multiview) {\n        append_line(vs_buf, &vs_len, vr_shader);\n        // GoldenEye decal band (gfx_opengl_draw_triangles): a view-space nudge\n        append_line(vs_buf, &vs_len, "gl_Position.z += uDecalBias.x / max(gl_Position.w, max(uDecalBias.y, 0.0001));");\n    }\n#endif'''
          if old not in os:
              raise SystemExit('vertex-position shader anchor not found')
          os = os.replace(old, new, 1)
          ogl.write_text(os)

          # Restore the ordinary Fast3D frame path on the phone.
          gfx = Path('upstream/port/fast3d/gfx_pc.cpp')
          gs = gfx.read_text()
          old = '''#ifdef GE_ANDROID_FLAT\n    /* Native flat path: same Fast3D display list, no emulation and no XR compositor. */\n    gfx_rapi->start_draw_to_framebuffer(0, (float)gfx_current_dimensions.height / SCREEN_HEIGHT);\n    gfx_rapi->clear_framebuffer(true, false);\n    gfx_run_dl(commands);\n    gfx_flush();\n    gfx_rapi->end_frame();\n    gfx_wapi->swap_buffers_begin();\n    return;\n#endif'''
          new = '''#ifdef GE_ANDROID_FLAT\n    /* Smartphone path: ordinary single-view GLES framebuffer. */\n    gfx_update_aspect_mode();\n    gVrFlatPass = false;\n    gfx_rapi->start_draw_to_framebuffer(game_renders_to_framebuffer ? game_framebuffer : 0,\n                                        (float)gfx_current_dimensions.height / SCREEN_HEIGHT);\n    gfx_rapi->clear_framebuffer(true, false);\n    gfx_run_dl(commands);\n    gfx_flush();\n    gfxFramebuffer = 0;\n\n    if (game_renders_to_framebuffer) {\n        gfx_rapi->start_draw_to_framebuffer(0, 1.0f);\n        gfx_rapi->clear_framebuffer(true, true);\n        if (gfx_msaa_level > 1) {\n            bool different_size = gfx_current_dimensions.width != gfx_current_game_window_viewport.width ||\n                                  gfx_current_dimensions.height != gfx_current_game_window_viewport.height;\n            if (different_size) {\n                gfx_rapi->resolve_msaa_color_buffer(game_framebuffer_msaa_resolved, game_framebuffer);\n                gfxFramebuffer = (uintptr_t)gfx_rapi->get_framebuffer_texture_id(game_framebuffer_msaa_resolved);\n            } else {\n                gfx_rapi->resolve_msaa_color_buffer(0, game_framebuffer);\n            }\n        } else {\n            gfxFramebuffer = (uintptr_t)gfx_rapi->get_framebuffer_texture_id(game_framebuffer);\n        }\n    }\n\n    gfx_rapi->end_frame();\n    gfx_wapi->swap_buffers_begin();\n    return;\n#endif'''
          if old not in gs:
              raise SystemExit('flat gfx_run anchor not found')
          gfx.write_text(gs.replace(old, new, 1))

          # Phone-sized, visible SDL GL window and explicit presentation.
          sdl = Path('upstream/port/fast3d/gfx_sdl2.cpp')
          ss = sdl.read_text()
          old = '''    window_width = VrRecommendedW;\n    window_height = VrRecommendedH;'''
          new = '''#ifdef GE_ANDROID_FLAT\n    window_width = set->width > 0 ? set->width : 1280;\n    window_height = set->height > 0 ? set->height : 720;\n#else\n    window_width = VrRecommendedW;\n    window_height = VrRecommendedH;\n#endif'''
          if old not in ss:
              raise SystemExit('SDL window-size anchor not found')
          ss = ss.replace(old, new, 1)

          old = '    Uint32 flags = SDL_WINDOW_HIDDEN | SDL_WINDOW_RESIZABLE | SDL_WINDOW_OPENGL;'
          new = '''#ifdef GE_ANDROID_FLAT\n    Uint32 flags = SDL_WINDOW_RESIZABLE | SDL_WINDOW_OPENGL;\n#else\n    Uint32 flags = SDL_WINDOW_HIDDEN | SDL_WINDOW_RESIZABLE | SDL_WINDOW_OPENGL;\n#endif'''
          if old not in ss:
              raise SystemExit('SDL hidden-window anchor not found')
          ss = ss.replace(old, new, 1)

          old = '''#ifdef GE_ANDROID_FLAT\n    SDL_GL_MakeCurrent(wnd, ctx);\n    SDL_GL_SwapWindow(wnd);\n#endif'''
          new = '''#ifdef GE_ANDROID_FLAT\n    if (SDL_GL_MakeCurrent(wnd, ctx) != 0) {\n        LOGI("flat: SDL_GL_MakeCurrent failed: %s", SDL_GetError());\n    }\n    SDL_GL_SwapWindow(wnd);\n#endif'''
          if old not in ss:
              raise SystemExit('flat swap anchor not found')
          sdl.write_text(ss.replace(old, new, 1))

          # Private ROM slot. The real ROM is injected after downloading the APK.
          g = Path('upstream/android/app/build.gradle')
          bs = g.read_text()
          android_anchor = 'android {\n'
          if android_anchor not in bs:
              raise SystemExit('build.gradle android block not found')
          bs = bs.replace(android_anchor, android_anchor + "    aaptOptions { noCompress 'z64' }\n", 1)
          g.write_text(bs)
          asset = Path('upstream/android/app/src/main/assets/ge.z64')
          asset.parent.mkdir(parents=True, exist_ok=True)
          with asset.open('wb') as f:
              f.truncate(12 * 1024 * 1024)
          PY

      - name: Install Android NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;25.1.8937393" \
            "cmake;3.22.1"

      - name: Build debug APK
        working-directory: upstream/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Verify reserved ROM slot
        run: |
          APK=upstream/android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          python3 - <<'PY'
          import zipfile
          apk='upstream/android/app/build/outputs/apk/debug/app-debug.apk'
          with zipfile.ZipFile(apk) as z:
              i=z.getinfo('assets/ge.z64')
              assert i.file_size == 12*1024*1024, i.file_size
              assert i.compress_type == zipfile.ZIP_STORED, i.compress_type
              print('ROM slot OK:', i.file_size, 'bytes, STORED')
          PY
          mkdir -p /tmp/geflat-output
          cp "$APK" /tmp/geflat-output/GoldenEye007-Android-ARM64-skeleton-v4.apk
          cp "$ANDROID_HOME/build-tools/34.0.0/lib/apksigner.jar" /tmp/geflat-output/apksigner.jar
          sha256sum "$APK"

      - name: Upload signing skeleton
        uses: actions/upload-artifact@v4
        with:
          name: GoldenEye007-Android-ARM64-skeleton-v4
          path: /tmp/geflat-output/
          if-no-files-found: error
          retention-days: 1
